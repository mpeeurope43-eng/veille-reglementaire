name: Veille réglementaire quotidienne

on:
  schedule:
    # 06:00 Europe/Paris toute l'année n'est pas trivial en cron UTC (heure d'été/hiver) :
    # 05:00 UTC ≈ 07:00 Paris (hiver) / 06:00 Paris (été). Ajuster si besoin.
    - cron: "0 5 * * *"
  workflow_dispatch: {} # permet aussi un déclenchement manuel depuis l'onglet Actions

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Pas de cache npm : il n'y a pas de package-lock.json committé (généré à la volée
          # ci-dessous), et actions/setup-node échoue si le fichier de cache-dependency-path
          # qu'on lui indique n'existe pas dans le repo.

      - name: Install dependencies
        working-directory: collector
        run: npm install

      - name: Run collector
        working-directory: collector
        env:
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: node index.js

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veille-run-log-${{ github.run_number }}
          path: collector/run-log.json
          retention-days: 30
